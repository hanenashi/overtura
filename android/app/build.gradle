plugins { id 'com.android.application' }

android {
    namespace 'io.github.hanenashi.overtura'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.hanenashi.overtura'
        minSdk 35
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(rootProject.file('../docs/mobile'))
}

dependencies { testImplementation 'junit:junit:4.13.2' }
