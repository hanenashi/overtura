plugins { id 'com.android.application' }

android {
    namespace 'io.github.hanenashi.overtura'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.hanenashi.overtura'
        minSdk 35
        targetSdk 36
        versionCode 3
        versionName '0.2.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(rootProject.file('../docs/mobile'))
    sourceSets.test.resources.srcDir(rootProject.file('../tests/fixtures/protocol-v1'))
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android supplies org.json at runtime. This dependency is JVM-test-only.
    testImplementation 'org.json:json:20260719'
}
